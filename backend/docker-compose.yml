services:
  db:
    image: postgres:16
    container_name: helpdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - helpdesk-data:/var/lib/postgresql/data

volumes:
  helpdesk-data: