<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpDesk — Novo chamado</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="logo">Help<span>Desk</span></a>
      <nav>
        <a href="index.html">Dashboard</a>
        <a href="chamados.html">Chamados</a>
        <a href="novo-chamado.html" class="ativo">Novo chamado</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div>
        <h1>Novo chamado</h1>
        <p>Descreva o problema para que a equipe de TI possa te atender</p>
      </div>
    </div>

    <form id="form-chamado" class="card form-card" novalidate>
      <div class="form-grupo">
        <label for="titulo">Título *</label>
        <input type="text" id="titulo" maxlength="120" placeholder="Ex.: Computador não liga" />
        <div class="campo-erro" id="erro-titulo"></div>
      </div>

      <div class="form-linha">
        <div class="form-grupo">
          <label for="categoria">Categoria *</label>
          <select id="categoria">
            <option value="">Selecione...</option>
          </select>
          <div class="campo-erro" id="erro-categoria"></div>
        </div>
        <div class="form-grupo">
          <label for="prioridade">Prioridade *</label>
          <select id="prioridade">
            <option value="">Selecione...</option>
          </select>
          <div class="campo-erro" id="erro-prioridade"></div>
        </div>
      </div>

      <div class="form-grupo">
        <label for="descricao">Descrição *</label>
        <textarea id="descricao" maxlength="1000" placeholder="Explique o que aconteceu, quando começou e o que você já tentou fazer."></textarea>
        <div class="ajuda"><span id="contagem">0</span>/1000 caracteres</div>
        <div class="campo-erro" id="erro-descricao"></div>
      </div>

      <div class="form-acoes">
        <a href="chamados.html" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn" id="btn-enviar">Abrir chamado</button>
      </div>
    </form>
  </main>

  <script type="module" src="js/novo-chamado.js"></script>
</body>
</html>
